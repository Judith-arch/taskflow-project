<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TaskFlow</title>
        <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Task Manager</h1>
    </header>

    <div class="app-wrapper">

        <aside class="sidebar">
            <!-- NAME + LOGO -->
            <div class="logo">
                <h2>App</h2>
            </div>

            <!-- PROJECTS / LISTS -->
            <nav class="projects">
                <h3>projects</h3>
                <ul>
                    <li>Project 1</li>
                    <li>Project 2</li>
                    <li>Project 3</li>
                </ul>
            </nav>

            <div class="user">
                <p>👤 User</p>
            </div>
        </aside>

        <main>
            <header>
                <h2>Project Name</h2>
            </header>

            <div class="main-top">
                <form id="taskForm">
                    <div class="form-properties">
                        <div class="field">
                            <label for="title">Name:</label>
                            <input type="text" id="title" name="title">
                        </div>
                        <div class="field">
                            <label for="deadline">Deadline:</label>
                            <input type="date" id="deadline" name="deadline">
                        </div>
                        <div class="field">
                            <label for="status">Status:</label>
                            <select id="status" name="status">
                                <option value="to-do">To-do</option>
                                <option value="doing">Doing</option>
                                <option value="review">Review</option>
                                <option value="done">Done</option>
                                <option value="cancelled">Cancelled</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="assigned">Assigned:</label>
                            <input type="text" id="assigned" name="assigned">
                        </div>
                        <div class="field">
                            <label for="archive">Archive:</label>
                            <input type="checkbox" id="archive" name="archive">
                        </div>
                    </div>
                    <textarea id="notes" name="notes" rows="8" placeholder="Document progress, problems, solutions..."></textarea>
                    <button class="addTask">Add Task</button>
                </form>

                <!-- CRITICAL TASKS -->
                <div class="critical-tasks">
                    <h3>Critical tasks</h3>
                    <ul id="criticalList"></ul>
                </div>
            </div>

            <div class="search-bar">
                <label for="search">Search:</label>
                <input type="search" id="search" placeholder="Search...">
            </div>

            <ul id="taskList">
                <li>Task 1</li>
                <li>Task 2</li>
                <li>Task 3</li>
            </ul>

            <template id="taskTemplate">
                <!-- sin cambios -->
            </template>

            <p id="numTaskCompleted">Completed =</p>
            <p id="numTaskInProgress">In Progress =</p>
            <p id="numTotalTasks">Total =</p>
        </main>

    </div>

    <footer>

    </footer>

    <script src="app.js"></script>
</body>
