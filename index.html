<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TaskFlow</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Task Manager</h1>
        <button id="darkToggle" onclick="toggleDark()" aria-label="Toggle dark mode">🌙 Dark mode</button>
    </header>

    <div class="app-wrapper">

        <aside class="sidebar" id="sidebar">
            <!-- NAME + LOGO -->
            <div class="logo">
                <h2>App</h2>
                <button onclick="toggleSidebar()" aria-label="Toggle sidebar" id="sidebarToggle">←</button>
            </div>

            <!-- PROJECTS / LISTS -->
            <nav class="projects">
                <h3>projects</h3>
                <ul>
                    <li>Project 1</li>
                    <li>Project 2</li>
                    <li>Project 3</li>
                </ul>
            </nav>

        </aside>

    <main>
        <header>
            <h2>Project Name</h2>
        </header>

        <!-- TOP: form + task list side by side -->
        <div class="main-top">
            <form id="taskForm">
                <div class="form-properties">
                    <div class="field">
                        <label for="title">New Task:</label>
                        <input type="text" id="title" name="title">
                    </div>
                    <div class="field">
                        <label for="deadline">Deadline:</label>
                        <input type="date" id="deadline" name="deadline">
                    </div>
                    <div class="field">
                        <label for="status">Status:</label>
                        <select id="status" name="status">
                            <option value="to-do">To-do</option>
                            <option value="doing">Doing</option>
                            <option value="review">Review</option>
                            <option value="done">Done</option>
                            <option value="cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="assigned">Assigned:</label>
                        <input type="text" id="assigned" name="assigned">
                    </div>
                    <div class="field">
                        <label for="priority">Priority:</label>
                        <select id="priority" name="priority">
                            <option value="1">⭐ Low</option>
                            <option value="2">⭐⭐ Medium</option>
                            <option value="3">⭐⭐⭐ High</option>
                        </select>
                    </div>
                </div>
                <button class="addTask">Add Task</button>
            </form>

            <!-- TASK LIST -->
            <div class="task-list-section">
                <div class="search-bar">
                    <input type="search" id="search" placeholder="Search...">
                </div>
                <div class="filters">
                    <button onclick="filterTasks('all')" class="filter-btn active">All</button>
                    <button onclick="filterTasks('to-do')" class="filter-btn">To-do</button>
                    <button onclick="filterTasks('doing')" class="filter-btn">Doing</button>
                    <button onclick="filterTasks('review')" class="filter-btn">Review</button>
                    <button onclick="filterTasks('done')" class="filter-btn">Done</button>
                    <button onclick="filterTasks('cancelled')" class="filter-btn">Cancelled</button>
                </div>
                <ul id="taskList"></ul>
            </div>
        </div>

        <!-- MIDDLE: statistics -->
        <div class="stats-section">
            <div class="stats-numbers">
                <span id="numTaskTodo">To-do: 0</span>
                <span id="numTaskInProgress">In Progress: 0</span>
                <span id="numTaskCompleted">Completed: 0</span>
                <span id="numTotalTasks">Total: 0</span>
            </div>
            <div class="progress-bar-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <p id="progressLabel">0% completed</p>
        </div>

        <!-- BOTTOM: critical tasks + calendar -->
        <div class="bottom-section">
            <div class="critical-tasks">
                <h3>Critical tasks</h3>
                <ul id="criticalList"></ul>
            </div>

            <div class="calendar-placeholder">
                <h3>Calendar</h3>
                <div id="calendarBody"></div>
            </div>

        </div>

    </main>

    </div>

<footer>
    <p>TaskFlow © 2026 — Made by Judith-Arch · <a href="https://github.com/Judith-arch/taskflow-project" target="_blank">GitHub</a></p>
</footer>

    <script src="app.js"></script>
</body>
